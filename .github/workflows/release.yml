name: release

on:
  push:
    tags:
      # Stable versions only: prerelease tags must not publish the
      # `latest` container channel or move it ahead of tarball
      # publication (the recipes reject prerelease versions).
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.1.0 (creates the tag)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  gate:
    name: quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
        with:
          install-cargo-deny: "true"
          install-cargo-audit: "true"
      - name: just quality
        run: just quality

  package:
    name: package (${{ matrix.name }})
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 is the current arm64 hosted label (macos-13 retired
          # 2025-12-04, macos-14 retired 2026-11-02). Intel macOS is not
          # a supported platform.
          - {name: macos-arm64, os: macos-26, target: native}
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
        with:
          # Linux legs cross-build: their target's std must be installed
          # (the toolchain file only self-installs x86_64-unknown-linux-gnu),
          # and the zig/cargo-zigbuild provisioning in the action covers the
          # `just release-tarball` zigbuild call.
          targets: ${{ matrix.target == 'native' && '' || matrix.target }}
      - name: build + tarball
        run: just release-tarball ${{ matrix.target }}
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wrkspc-${{ matrix.name }}
          # The per-target checksum fragments ride with the tarballs:
          # the release job's `just release-checksum` concatenates
          # SHA256SUMS-*, and fragments that never upload make that
          # recipe fail (cat of missing files under pipefail).
          path: |
            dist/wrkspc-*.tar.gz
            dist/SHA256SUMS-*
          if-no-files-found: error

  release:
    name: sign + publish
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-rust
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wrkspc-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: just release-checksum
      - name: minisign signatures (when key is configured)
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MINISIGN_KEY:-}" ]]; then
            echo "::warning::MINISIGN_KEY unset; tarballs are unsigned"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq minisign
            printf '%s' "$MINISIGN_KEY" > /tmp/minisign.key
            chmod 600 /tmp/minisign.key
            MINISIGN_KEY_FILE=/tmp/minisign.key just release-sign
            rm -f /tmp/minisign.key
          fi
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The version is a maintainer-pushed tag or a workflow_dispatch
        # input (write-access-only), never an untrusted event payload;
        # release-publish still shape-checks it before touching the shell.
        # github.sha anchors the release to the exact commit the packaged
        # binaries were built from (T11).
        run: >-
          just release-publish
          ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          ${{ github.sha }}

  container:
    name: container image (ghcr)
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing uses the ambient GitHub OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # just only — the image wraps the prebuilt tarball binaries, so
      # this job needs no Rust toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          install-rust: "false"
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wrkspc-linux-*
          path: dist
          merge-multiple: true
      # The version is a maintainer-pushed tag or a workflow_dispatch
      # input (write-access-only), never an untrusted event payload;
      # publish-image.sh still shape-checks it before touching the shell.
      # GITHUB_TOKEN is not exported by Actions by default; the publish
      # script requires it for the GHCR login.
      - name: publish image to ghcr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just release-image ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
