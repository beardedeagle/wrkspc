name: release

on:
  push:
    tags:
      # Stable versions only: prerelease tags must not publish the
      # `latest` container channel or move it ahead of tarball
      # publication (the recipes reject prerelease versions).
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, e.g. 0.1.0 (creates the tag)"
        required: true
        default: ""

# No workflow-wide privileges: gate and package jobs need nothing, and the
# release job alone receives contents: write for the GitHub Release publish
# (the container job's narrower grants are declared on it).
permissions: {}

jobs:
  gate:
    name: quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-rust
        with:
          install-cargo-deny: "true"
          install-cargo-audit: "true"

      - name: just quality
        run: just quality

  package:
    name: package (${{ matrix.name }})
    needs: gate
    runs-on: ${{ matrix.os }}
    permissions:
      # Attestations bind each tarball to this workflow run and commit
      # over the ambient OIDC identity — keyless: no long-lived secrets.
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 (arm64) and macos-26-intel (x86_64) are the current
          # hosted labels (macos-13 retired 2025-12-04, macos-14 retired
          # 2026-11-02). Both macOS architectures are supported; each
          # native leg derives its artifact name from the runner's host.
          - {name: macos-arm64, os: macos-26, target: native, rust-targets: ""}
          - {name: macos-x86_64, os: macos-26-intel, target: native, rust-targets: ""}
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rust-targets: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            rust-targets: aarch64-unknown-linux-gnu
          # Windows legs build natively with the runner's MSVC toolchain
          # (no zig, no cross tooling: install-zig stays false for them)
          # and package as .zip.
          - name: windows-x86_64
            os: windows-2025
            target: windows
            rust-targets: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-11-arm
            target: windows-arm
            rust-targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # No caches in the release pipeline: a release build must consume
      # only freshly fetched, pinned inputs — restored cache entries are a
      # poisoning path straight into the published binaries.
      - uses: $/.github/actions/setup-rust
        with:
          # Each leg declares the rust-std targets it needs: Linux cross
          # legs install their target's std for the zigbuild link,
          # Windows legs install the MSVC std for native builds, and the
          # native legs install nothing extra.
          targets: ${{ matrix.rust-targets }}
          # Windows legs build natively with the runner's MSVC — the
          # zig/cargo-zigbuild provisioning is for Linux cross legs only.
          install-zig: ${{ !startsWith(matrix.os, 'windows') }}

      - name: build + tarball
        # bash everywhere: the recipe is a bash shebang script, and the
        # Windows runners' default shell is pwsh.
        shell: bash
        run: just release-tarball ${{ matrix.target }}
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wrkspc-${{ matrix.name }}
          # The per-target checksum fragments ride with the tarballs:
          # the release job's `just release-checksum` concatenates
          # SHA256SUMS-*, and fragments that never upload make that
          # recipe fail (cat of missing files under pipefail).
          path: |
            dist/wrkspc-*.tar.gz
            dist/wrkspc-*.zip
            dist/SHA256SUMS-*
          if-no-files-found: error
      # v2 — the release's integrity signature: Sigstore attestations
      # over each tarball's digest, issued to this workflow's OIDC
      # identity. No long-lived signing key exists anywhere.
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: |
            dist/wrkspc-*.tar.gz
            dist/wrkspc-*.zip
            dist/SHA256SUMS-*

  release:
    name: publish
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # The publish waits on the operator's approval for the protected
    # environment: a GitHub Release is a write-only privileged action,
    # and approval is the human gate before it goes out. No key material
    # exists — artifact integrity rides the keyless attestations made on
    # the package legs.
    environment:
      name: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wrkspc-*
          path: dist
          merge-multiple: true
      - name: checksums
        run: just release-checksum
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }} # zizmor: ignore[unsound-ternary]
          # github.sha anchors the release to the exact commit the
          # packaged binaries were built from (T11).
          RELEASE_SHA: ${{ github.sha }}
        run: >-
          just release-publish
          "$RELEASE_VERSION"
          "$RELEASE_SHA"

  container:
    name: container image (ghcr)
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing uses the ambient GitHub OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # just only — the image wraps the prebuilt tarball binaries, so
      # this job needs no Rust toolchain.
      - uses: $/.github/actions/setup-rust
        with:
          install-rust: "false"
      # v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wrkspc-linux-*
          path: dist
          merge-multiple: true
      # GITHUB_TOKEN is not exported by Actions by default; the publish
      # script requires it for the GHCR login.
      - name: publish image to ghcr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }} # zizmor: ignore[unsound-ternary]
        run: just release-image "$IMAGE_VERSION"
