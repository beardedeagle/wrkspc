name: Security

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: dependency security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust
        with:
          install-cargo-deny: "true"
          install-cargo-audit: "true"

      - name: just deny-check
        run: just deny-check

      - name: just audit
        run: just audit

      - name: just osv
        run: just osv
