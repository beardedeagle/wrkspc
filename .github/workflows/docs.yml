name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      # deploy/README.md is copied into the book by `just docs`, and
      # the Justfile recipe + its inputs change the build itself.
      - "deploy/README.md"
      - "Justfile"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "deploy/README.md"
      - "Justfile"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build book
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust

      - name: Install mdbook (pinned)
        run: cargo install mdbook --version 0.5.4 --locked --target-dir target/cargo-install

      - name: just docs
        run: just docs
