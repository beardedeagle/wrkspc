name: Accessibility issue
description: Report an accessibility barrier in the wrkspc operator UI or documentation.
title: "[a11y]: <short description of the issue>"
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an accessibility issue.
        Reports like yours help us make wrkspc usable by everyone.

        Please share as much as you're comfortable with — partial
        reports are still useful. If you're using assistive technology,
        feel free to describe what you experienced in your own words.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the accessibility barrier you encountered.
      placeholder: "Example: the cohort menu can't be reached by keyboard alone, so I can't moderate without a pointer."
    validations:
      required: true

  - type: textarea
    id: demo
    attributes:
      label: Demo, screenshot or video
      description: Upload or provide a link to a demo, screenshot, or video that illustrates the issue.
    validations:
      required: false

  - type: input
    id: page-url
    attributes:
      label: Page or route
      description: The page, route, or UI view where you encountered the issue.
      placeholder: "e.g. the conversation view, /api/…, or the docs page URL"
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: "I expected the focus indicator to be clearly visible when I tabbed to the control."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
      placeholder: "There was no visible focus indicator, and my screen reader didn't announce the control."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the operator UI.
        2. Press Tab to move focus to the first interactive element.
        3. Observe that...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity (revised during triage as needed)
      description: |
        How much does this issue affect your ability to use wrkspc?
      options:
        - Critical
        - Serious
        - Moderate
        - Minor
      default: 2
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "macOS 14.5, Windows 11, Ubuntu 22.04"
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 124, Firefox 125, Safari 17.4, Edge 124"
    validations:
      required: false

  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology and version
      description: If assistive technology was used, please tell us which one(s) and which version(s).
      placeholder: "VoiceOver (macOS 14.5), NVDA 2024.1, JAWS 2024, TalkBack on Android 14"
    validations:
      required: false

  - type: input
    id: wcag
    attributes:
      label: Related WCAG criteria (optional)
      description: |
        If you know which WCAG success criteria this relates to, please
        share. Don't worry if you're not sure — we'll figure it out
        during triage.
      placeholder: "2.4.7 Focus Visible, 1.4.3 Contrast (Minimum)"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else we should know? Related issues or workarounds you've tried.
    validations:
      required: false

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
