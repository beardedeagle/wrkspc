# Dependabot version updates for wrkspc.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Rust crates — the Cargo workspace at the repository root. The
  # sqlx dependency is pinned to an upstream git revision until the
  # patched libsqlite3-sys ships in a release; Dependabot does not
  # touch git-sourced dependencies, so that pin stays operator-owned.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # Roll routine minor/patch bumps into one weekly PR; major bumps
      # stay separate so a breaking change gets its own focused review.
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions — workflows and the local composite action pin
  # third-party actions to commit SHAs; Dependabot keeps those SHAs
  # current and annotates each bump with the human-readable version.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
