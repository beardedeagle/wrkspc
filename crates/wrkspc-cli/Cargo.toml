[package]
name = "wrkspc-cli"
description = "Command-line node, hub, and operator tooling for the wrkspc coordination workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wrkspc"
path = "src/main.rs"

[dependencies]
libc = "0.2"
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tower = "0.5"
uuid.workspace = true
toml = "1.2"
agent-client-protocol.workspace = true
wrkspc-core = { version = "0.1.0", path = "../wrkspc-core" }
wrkspc-acp = { version = "0.1.0", path = "../wrkspc-acp" }
wrkspc-mcp = { version = "0.1.0", path = "../wrkspc-mcp" }
wrkspc-dispatcher = { version = "0.1.0", path = "../wrkspc-dispatcher" }
wrkspc-ui = { version = "0.1.0", path = "../wrkspc-ui" }
wrkspc-a2a = { version = "0.1.0", path = "../wrkspc-a2a" }
a2a-lf.workspace = true
a2a-client-lf.workspace = true
axum = "0.8"
chrono.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"

# The workspace lint table, spelled out because Cargo forbids
# `workspace = true` combined with overrides: the ONLY deviation is
# the reviewed platform-FFI exception below (T05). Keep this table in
# sync with the root `[workspace.lints]`.
[lints.rust]
unsafe_code = "allow"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# The CLI's println!/eprintln! output IS the product surface (ui-token
# instructions, installer outcomes, status lines); the print lints stay
# enforced in every library crate.
print_stderr = "allow"
print_stdout = "allow"
unimplemented = "warn"
wildcard_dependencies = "deny"

# The reviewed platform-FFI exception: this crate's macOS Keychain
# integration (src/secrets.rs) and the one geteuid call (src/util.rs,
# unix-only) are unsafe by nature — security-framework-sys / libc
# bindings — and live in clearly marked, cfg-gated functions with the
# policy documented at each site. Every OTHER crate inherits
# unsafe_code = "forbid" unchanged from the workspace table.


[dev-dependencies]
assert_cmd = "2"
# The core-dump guard test reads RLIMIT_CORE back to prove the guard took hold;
# `libc` is already a normal dependency of this crate.
libc = "0.2"
rcgen = "0.14"
rustls-pki-types = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
