[package]
name = "wrkspc-cli"
description = "Command-line node, hub, and operator tooling for the wrkspc coordination workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wrkspc"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
tower = "0.5"
uuid.workspace = true
toml = "0.8"
agent-client-protocol.workspace = true
wrkspc-core = { path = "../wrkspc-core" }
wrkspc-acp = { path = "../wrkspc-acp" }
wrkspc-mcp = { path = "../wrkspc-mcp" }
wrkspc-dispatcher = { path = "../wrkspc-dispatcher" }
wrkspc-ui = { path = "../wrkspc-ui" }
wrkspc-a2a = { path = "../wrkspc-a2a" }
a2a-lf.workspace = true
a2a-client-lf.workspace = true
axum = "0.8"
chrono.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
security-framework-sys = "2"

[dev-dependencies]
assert_cmd = "2"
rcgen = "0.13"
rustls-pki-types = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
